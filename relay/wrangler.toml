name = "race-wars-relay"
main = "worker.js"
compatibility_date = "2025-06-01"

# two Durable Object classes: a Room is one instance per room code, the Lobby is one instance
# for the whole relay (the open-room registry behind GET /open)
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

# SQLite-backed DO classes are the ones the free plan allows (a Room stores nothing; the Lobby
# keeps one small map). A new class needs its own migration tag: never edit v1, add v2.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Lobby"]

# Progress accounts. Create the database, paste its id over the placeholder, then
# run schema.sql. See the "Accounts" section of README.md. Rooms do not use this.
[[d1_databases]]
binding = "DB"
database_name = "race-wars-progress"
database_id = "REPLACE_AFTER_CREATE"

# The magic-link email is sent with Resend. RESEND_API_KEY is a secret
# (`wrangler secret put RESEND_API_KEY`), not a var. Until a domain is verified,
# onboarding@resend.dev only delivers to the Resend account's own address.
[vars]
FROM_EMAIL = "Race Wars <onboarding@resend.dev>"
GAME_URL = "https://barnickelus.github.io/Sperm-Racer/index.html"
