name = "race-wars-relay"
main = "worker.js"
compatibility_date = "2025-06-01"

# one Durable Object class; a room is one instance of it, addressed by its code
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# SQLite-backed DO classes are the ones the free plan allows (we store nothing in it)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
