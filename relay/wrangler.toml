name = "race-wars-relay"
main = "worker.js"
compatibility_date = "2025-06-01"

# two Durable Object classes: a Room is one instance per room code, the Lobby is one instance
# for the whole relay (the open-room registry behind GET /open)
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

# SQLite-backed DO classes are the ones the free plan allows (a Room stores nothing; the Lobby
# keeps one small map). A new class needs its own migration tag: never edit v1, add v2.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Lobby"]
