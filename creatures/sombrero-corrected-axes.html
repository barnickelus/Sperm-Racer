<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sombrero Actor — Corrected Axes</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#08101b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#app{position:fixed;inset:0} canvas{display:block;width:100%;height:100%;touch-action:none}
#ui{position:fixed;z-index:5;left:14px;top:14px;max-width:560px;background:rgba(4,8,14,.82);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:14px 16px;backdrop-filter:blur(12px)}
h1{font-size:20px;margin:0 0 8px}.row{display:flex;gap:8px;flex-wrap:wrap}
button{border:0;border-radius:11px;padding:9px 12px;font-weight:750;font-size:14px}
p{font-size:13px;line-height:1.35;color:#b8c3d5;margin:8px 0}
#fallback{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;color:#cad5e7;background:#08101b;z-index:2}
</style>
</head>
<body>
<div id="app"></div>
<div id="fallback">Loading corrected Three.js actor…</div>
<div id="ui"><h1>Sombrero Actor — Corrected Front/Side Axes</h1><div class="row"><button id="front">Front</button><button id="left">Left</button><button id="right">Right</button><button id="three">3/4</button><button id="spin">Auto rotate</button></div><p>X = face width · Y = vertical · Z = front/back. Face is on −Z. Tail extends +Z.</p></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const fallback=document.getElementById('fallback');if(!window.THREE){fallback.textContent='Three.js could not load.';return;}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x08101b);const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.05,100);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputEncoding=THREE.sRGBEncoding;document.getElementById('app').appendChild(renderer.domElement);fallback.style.display='none';scene.add(new THREE.HemisphereLight(0xd9eaff,0x24160d,1.6));const key=new THREE.DirectionalLight(0xfff1cf,2.1);key.position.set(-4,7,-6);key.castShadow=true;scene.add(key);const floor=new THREE.Mesh(new THREE.CircleGeometry(8,96),new THREE.MeshStandardMaterial({color:0x202a38,roughness:.92}));floor.rotation.x=-Math.PI/2;floor.position.y=-2.2;floor.receiveShadow=true;scene.add(floor);const root=new THREE.Group();scene.add(root);const M={tan:0xb87431,tan2:0xd99a49,dark:0x160b08,red:0xc92b27,yellow:0xe9bc2d,green:0x2c7445,white:0xf2ede3,black:0x080808};const mat=(c,r=.6)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:.02});const mats={tan:mat(M.tan),tan2:mat(M.tan2),dark:mat(M.dark,.5),red:mat(M.red),yellow:mat(M.yellow),green:mat(M.green),white:mat(M.white,.45),black:mat(M.black,.4)};const sphereGeo=new THREE.SphereGeometry(1,12,9);function bead(x,y,z,r,m){const o=new THREE.Mesh(sphereGeo,m);o.scale.setScalar(r);o.position.set(x,y,z);o.castShadow=true;root.add(o);return o;}function ellipsoid(cx,cy,cz,rx,ry,rz,spacing,r,m){const rows=Math.max(7,Math.round(Math.PI*ry/spacing));for(let j=1;j<rows;j++){const phi=Math.PI*j/rows,ring=Math.sin(phi),y=cy+Math.cos(phi)*ry;const n=Math.max(8,Math.round(2*Math.PI*Math.max(rx,rz)*ring/spacing));for(let i=0;i<n;i++){const a=i/n*Math.PI*2+(j%2)*Math.PI/n;bead(cx+Math.cos(a)*rx*ring,y,cz+Math.sin(a)*rz*ring,r,m)}}}function tube(points,rows=5,r=.065){const curve=new THREE.CatmullRomCurve3(points,false,'catmullrom',.45);for(let row=0;row<rows;row++){const zoff=(row-(rows-1)/2)*.075;curve.getSpacedPoints(21).forEach(p=>bead(p.x,p.y,p.z+zoff,r,mats.black));}}function coneAlongZ(z0,len,rad,spacing,r){const rings=Math.max(6,Math.floor(len/spacing));for(let j=0;j<=rings;j++){const u=j/rings,z=z0+u*len,rr=rad*(1-u),n=Math.max(1,Math.round(2*Math.PI*rr/spacing));let m=mats.dark;if((u>.20&&u<.32)||(u>.50&&u<.61)||(u>.76&&u<.84))m=mats.tan2;for(let i=0;i<n;i++){const a=i/n*Math.PI*2+(j%2)*Math.PI/n;bead(Math.cos(a)*rr,-.27+Math.sin(a)*rr,z,r,m)}}}function brim(y,outer,inner,spacing,r){const rings=Math.ceil((outer-inner)/spacing);for(let q=0;q<=rings;q++){const rr=inner+q*spacing,n=Math.max(12,Math.round(2*Math.PI*rr/spacing));for(let i=0;i<n;i++){const a=i/n*Math.PI*2;let m=mats.yellow;if(q===0||q===rings)m=mats.red;else{const k=(i+q*2)%12;m=k<3?mats.yellow:k<6?mats.green:k<9?mats.red:mats.dark;}bead(Math.cos(a)*rr,y,Math.sin(a)*rr,r,m)}}}ellipsoid(0,-.33,0,1,1.06,.88,.145,.078,mats.tan);for(let y=0;y<=1.1;y+=.13){const t=y/1.1,rr=.58*(1-Math.pow(t,1.75))+.07,n=Math.max(7,Math.round(2*Math.PI*rr/.14));for(let i=0;i<n;i++){const a=i/n*Math.PI*2+(Math.round(y/.13)%2)*Math.PI/n;bead(Math.cos(a)*rr,.98+y*.5,Math.sin(a)*rr,.073,mats.tan)}}brim(.95,1.64,.62,.145,.071);for(const x of [-.34,.34]){ellipsoid(x,.02,-.86,.24,.25,.10,.105,.058,mats.white);bead(x,.02,-1.02,.105,mats.black)}const left=[new THREE.Vector3(-.05,-.20,-.98),new THREE.Vector3(-.32,-.30,-1.03),new THREE.Vector3(-.62,-.46,-1.06),new THREE.Vector3(-.82,-.56,-1.05),new THREE.Vector3(-.68,-.72,-1.02),new THREE.Vector3(-.38,-.66,-1.00)];const right=left.map(p=>new THREE.Vector3(-p.x,p.y,p.z));tube(left,5,.065);tube(right,5,.065);coneAlongZ(.80,2.76,.53,.145,.071);let yaw=0,pitch=.05,dist=8.4,drag=false,lx=0,ly=0,auto=false;function updateCamera(){camera.position.set(Math.sin(yaw)*Math.cos(pitch)*dist,1+Math.sin(pitch)*dist,-Math.cos(yaw)*Math.cos(pitch)*dist);camera.lookAt(0,-.05,.65)}updateCamera();const el=renderer.domElement;el.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-lx)*.008;pitch=Math.max(-.65,Math.min(.65,pitch+(e.clientY-ly)*.006));lx=e.clientX;ly=e.clientY;updateCamera()});el.addEventListener('pointerup',()=>drag=false);document.getElementById('front').onclick=()=>{yaw=0;pitch=.02;dist=8.1;updateCamera()};document.getElementById('left').onclick=()=>{yaw=-Math.PI/2;pitch=.02;dist=8.7;updateCamera()};document.getElementById('right').onclick=()=>{yaw=Math.PI/2;pitch=.02;dist=8.7;updateCamera()};document.getElementById('three').onclick=()=>{yaw=-.65;pitch=.10;dist=8.7;updateCamera()};document.getElementById('spin').onclick=()=>auto=!auto;function animate(t){requestAnimationFrame(animate);if(auto){yaw-=.004;updateCamera()}root.position.y=Math.sin(t*.0014)*.035;renderer.render(scene,camera)}animate(0);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
})();
</script>
</body>
</html>
