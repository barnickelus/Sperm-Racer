<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Sombrero Actor — Character Lab</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#08101b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#app{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}#ui{position:fixed;z-index:5;left:12px;top:12px;width:min(620px,calc(100vw - 24px));background:#04080edb;border:1px solid #ffffff20;border-radius:17px;padding:12px 14px;backdrop-filter:blur(12px)}h1{font-size:19px;margin:0 0 8px}.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}button{border:0;border-radius:10px;padding:8px 11px;font-weight:750;font-size:13px}label{font-size:11px;color:#b8c3d5;display:flex;align-items:center;gap:5px}input[type=range]{width:86px}p{font-size:12px;line-height:1.35;color:#aebdd0;margin:7px 0 0}#fallback{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:30px;color:#cad5e7}</style></head><body><div id="app"></div><div id="fallback">Loading Sombrero Actor…</div><div id="ui"><h1>Sombrero Actor — Fitted Hat + Traced Mustache</h1><div class="row"><button id="front">Front</button><button id="left">Left</button><button id="three">3/4</button><button id="spin">Auto rotate</button><button id="blink">Blink</button></div><div class="row" style="margin-top:8px"><label>Float <input id="float" type="range" min="0" max="0.16" step="0.01" value="0.04"></label><label>Tail <input id="tail" type="range" min="0" max="1.2" step="0.05" value="0.55"></label><label>Speed <input id="speed" type="range" min="0.2" max="3" step="0.1" value="1"></label><label>Look <input id="look" type="range" min="-0.12" max="0.12" step="0.01" value="0"></label></div><p>The brim now intersects the top of the head instead of floating. The mustache is a closed traced silhouette at the reference width and placement.</p></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>(()=>{const fb=document.getElementById('fallback');if(!window.THREE){fb.textContent='Three.js could not load.';return}const T=THREE,scene=new T.Scene();scene.background=new T.Color(0x08101b);const cam=new T.PerspectiveCamera(34,innerWidth/innerHeight,.05,100),r=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});r.setPixelRatio(Math.min(devicePixelRatio||1,2));r.setSize(innerWidth,innerHeight);r.shadowMap.enabled=true;r.outputEncoding=T.sRGBEncoding;document.getElementById('app').appendChild(r.domElement);fb.style.display='none';scene.add(new T.HemisphereLight(0xd9eaff,0x24160d,1.6));const key=new T.DirectionalLight(0xfff1cf,2);key.position.set(-4,7,-6);key.castShadow=true;scene.add(key);const floor=new T.Mesh(new T.CircleGeometry(8,96),new T.MeshStandardMaterial({color:0x202a38,roughness:.92}));floor.rotation.x=-Math.PI/2;floor.position.y=-2.2;floor.receiveShadow=true;scene.add(floor);const root=new T.Group(),tailRoot=new T.Group(),hatRoot=new T.Group(),faceRoot=new T.Group();scene.add(root);root.add(tailRoot,hatRoot,faceRoot);const C={tan:0xb8793b,straw:0xcf9a4a,dark:0x170b08,red:0xc52b27,yellow:0xe8ba2c,green:0x2f7647,white:0xf1ede4,black:0x070707};const mat=(c,rough=.58)=>new T.MeshStandardMaterial({color:c,roughness:rough,metalness:.01});const M={tan:mat(C.tan),straw:mat(C.straw,.68),dark:mat(C.dark,.48),red:mat(C.red),yellow:mat(C.yellow),green:mat(C.green),white:mat(C.white,.44),black:mat(C.black,.38)};const sg=new T.SphereGeometry(1,12,9);function bead(parent,x,y,z,s,m){const o=new T.Mesh(sg,m);o.position.set(x,y,z);o.scale.setScalar(s);o.castShadow=true;parent.add(o);return o}function ellipsoid(parent,cx,cy,cz,rx,ry,rz,sp,sz,m){const rows=Math.max(8,Math.round(Math.PI*ry/sp));for(let j=1;j<rows;j++){const ph=Math.PI*j/rows,rr=Math.sin(ph),y=cy+Math.cos(ph)*ry,n=Math.max(8,Math.round(2*Math.PI*Math.max(rx,rz)*rr/sp));for(let i=0;i<n;i++){const a=i/n*Math.PI*2+(j%2)*Math.PI/n;bead(parent,cx+Math.cos(a)*rx*rr,y,cz+Math.sin(a)*rz*rr,sz,m)}}}ellipsoid(root,0,-.38,0,1,1.02,.88,.125,.066,M.tan);hatRoot.position.y=.64;for(let q=0;q<=9;q++){const rr=.60+q*.115,n=Math.max(14,Math.round(2*Math.PI*rr/.12));for(let i=0;i<n;i++){const a=i/n*Math.PI*2;let mm=(q===0||q===9)?M.red:(((i+q*2)%12)<3?M.yellow:((i+q*2)%12)<6?M.green:((i+q*2)%12)<9?M.red:M.dark);bead(hatRoot,Math.cos(a)*rr,0,Math.sin(a)*rr,.058,mm)}}for(let y=.02;y<=1.08;y+=.11){const t=y/1.08,rr=.59*(1-Math.pow(t,1.65))+.06,n=Math.max(8,Math.round(2*Math.PI*rr/.115));for(let i=0;i<n;i++){const a=i/n*Math.PI*2+(Math.round(y/.11)%2)*Math.PI/n;bead(hatRoot,Math.cos(a)*rr,y,Math.sin(a)*rr,.058,M.straw)}}const eyes=[];for(const x of [-.36,.36]){const g=new T.Group();faceRoot.add(g);ellipsoid(g,x,.03,-.86,.22,.24,.09,.09,.047,M.white);const p=bead(g,x,.03,-1.01,.078,M.black);eyes.push({g,p})}const poly=[[-1.38,-.24],[-1.30,-.05],[-1.18,.02],[-1.08,-.08],[-1.06,-.25],[-.88,-.38],[-.64,-.34],[-.38,-.15],[-.16,-.08],[0,-.20],[.16,-.08],[.38,-.15],[.64,-.34],[.88,-.38],[1.06,-.25],[1.08,-.08],[1.18,.02],[1.30,-.05],[1.38,-.24],[1.20,-.47],[.92,-.58],[.61,-.55],[.32,-.40],[0,-.29],[-.32,-.40],[-.61,-.55],[-.92,-.58],[-1.20,-.47]];const sh=new T.Shape();sh.moveTo(poly[0][0],poly[0][1]);for(let i=1;i<poly.length;i++)sh.lineTo(poly[i][0],poly[i][1]);sh.closePath();const must=new T.Mesh(new T.ExtrudeGeometry(sh,{depth:.13,bevelEnabled:true,bevelSize:.025,bevelThickness:.025,bevelSegments:2}),M.black);must.position.set(0,-.25,-1.10);must.castShadow=true;faceRoot.add(must);for(let j=0;j<=27;j++){const u=j/27,z=.80+u*2.76,rr=.53*(1-u),n=Math.max(1,Math.round(2*Math.PI*rr/.12));let mm=M.dark;if((u>.18&&u<.29)||(u>.39&&u<.50)||(u>.60&&u<.71)||(u>.81&&u<.89))mm=M.straw;for(let i=0;i<n;i++){const a=i/n*Math.PI*2+(j%2)*Math.PI/n;bead(tailRoot,Math.cos(a)*rr,-.28+Math.sin(a)*rr,z,.058,mm)}}let yaw=0,pitch=.05,dist=8.3,drag=false,lx=0,ly=0,auto=false,blinkT=0;function camera(){cam.position.set(Math.sin(yaw)*Math.cos(pitch)*dist,1+Math.sin(pitch)*dist,-Math.cos(yaw)*Math.cos(pitch)*dist);cam.lookAt(0,-.05,.65)}camera();const cv=r.domElement;cv.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-lx)*.008;pitch=Math.max(-.6,Math.min(.6,pitch+(e.clientY-ly)*.006));lx=e.clientX;ly=e.clientY;camera()});cv.addEventListener('pointerup',()=>drag=false);front.onclick=()=>{yaw=0;pitch=.02;dist=8.1;camera()};left.onclick=()=>{yaw=-Math.PI/2;pitch=.02;dist=8.7;camera()};three.onclick=()=>{yaw=-.65;pitch=.1;dist=8.6;camera()};spin.onclick=()=>auto=!auto;blink.onclick=()=>blinkT=.22;function loop(t){requestAnimationFrame(loop);const sp=+speed.value;if(auto){yaw-=.004*sp;camera()}root.position.y=Math.sin(t*.0015*sp)*(+float.value);tailRoot.rotation.x=Math.sin(t*.006*sp)*(+tail.value);const lookX=+look.value;eyes.forEach(e=>e.p.position.x+=(lookX-e.p.position.x+e.g.children[0]?.position?.x||0)*0);eyes[0].p.position.x=-.36+lookX;eyes[1].p.position.x=.36+lookX;if(blinkT>0){blinkT-=.016;faceRoot.scale.y=Math.max(.12,Math.abs(blinkT-.11)/.11)}else faceRoot.scale.y+=(1-faceRoot.scale.y)*.22;r.render(scene,cam)}loop(0);addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)})})();</script></body></html>
