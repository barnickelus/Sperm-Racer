<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Three.js Creature Iterations</title><style>:root{--bg:#07101d;--line:#263950;--text:#eef5ff;--muted:#9fb0c6;--cyan:#2ed2ff}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:grid;grid-template-rows:auto 1fr;overflow:hidden}header{padding:12px 14px;border-bottom:1px solid var(--line);background:#091421;display:flex;gap:10px;align-items:center;flex-wrap:wrap}h1{font-size:18px;margin:0 10px 0 0}.picker{display:flex;gap:6px;overflow-x:auto;flex:1;padding:2px}.picker button{flex:0 0 auto;border:1px solid var(--line);background:#111e30;color:var(--text);border-radius:10px;padding:8px 11px;font-weight:800}.picker button.active{background:var(--cyan);color:#001018}.open{color:#001018;background:var(--cyan);padding:8px 11px;border-radius:10px;text-decoration:none;font-weight:800}main{position:relative;min-height:0}.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#02060b}@media(max-width:600px){header{padding:8px}h1{font-size:15px;width:100%}}</style></head><body><header><h1 id="title">Three.js Creature Iterations</h1><div class="picker" id="picker"></div><a class="open" id="open" target="_blank">Open full screen</a></header><main><div class="loading" id="loading">Loading iteration…</div><iframe id="frame" allow="fullscreen" title="Creature iteration"></iframe></main><script src="data-1.js"></script><script src="data-2.js"></script><script src="data-3.js"></script><script src="data-4.js"></script><script>const items=window.ITERATION_ITEMS||[],picker=document.getElementById('picker'),frame=document.getElementById('frame'),title=document.getElementById('title'),loading=document.getElementById('loading'),open=document.getElementById('open');let currentUrl='';async function decode(b64){const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));return await new Response(stream).text()}async function show(index){loading.style.display='grid';[...picker.children].forEach((b,i)=>b.classList.toggle('active',i===index));const item=items[index];title.textContent=`${item.n}. ${item.title}`;try{const text=await decode(item.data);if(currentUrl)URL.revokeObjectURL(currentUrl);currentUrl=URL.createObjectURL(new Blob([text],{type:'text/html'}));frame.src=currentUrl;open.href=currentUrl;frame.onload=()=>loading.style.display='none';location.hash=String(item.n)}catch(error){loading.textContent='This iteration failed to load. Try another numbered version.';console.error(error)}}items.forEach((item,i)=>{const b=document.createElement('button');b.textContent=String(item.n).padStart(2,'0');b.title=item.title;b.onclick=()=>show(i);picker.appendChild(b)});const n=Math.max(1,Math.min(items.length,parseInt(location.hash.slice(1))||1));show(n-1);</script></body></html>
