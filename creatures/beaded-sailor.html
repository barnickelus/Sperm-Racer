<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Beaded Sailor — Character Lab</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#07101d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#app{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}#ui{position:fixed;z-index:5;left:12px;top:12px;width:min(620px,calc(100vw - 24px));background:#04080edb;border:1px solid #ffffff20;border-radius:17px;padding:12px 14px;backdrop-filter:blur(12px)}h1{font-size:19px;margin:0 0 8px}.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}button{border:0;border-radius:10px;padding:8px 11px;font-weight:750;font-size:13px}label{font-size:11px;color:#b8c3d5;display:flex;align-items:center;gap:5px}input[type=range]{width:86px}p{font-size:12px;line-height:1.35;color:#aebdd0;margin:7px 0 0}#fallback{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:30px;color:#cad5e7}</style></head><body><div id="app"></div><div id="fallback">Loading Beaded Sailor…</div><div id="ui"><h1>Beaded Sailor — Animated Actor</h1><div class="row"><button id="front">Front</button><button id="left">Left</button><button id="three">3/4</button><button id="spin">Auto rotate</button><button id="blink">Blink</button></div><div class="row" style="margin-top:8px"><label>Float <input id="float" type="range" min="0" max="0.18" step="0.01" value="0.06"></label><label>Tail <input id="tail" type="range" min="0" max="1.4" step="0.05" value="0.75"></label><label>Speed <input id="speed" type="range" min="0.2" max="3" step="0.1" value="1"></label><label>Smile <input id="smile" type="range" min="-0.3" max="0.5" step="0.05" value="0.15"></label></div><p>Floating pink bead creature with a fitted white sailor cap, blue-and-white swimming tail, eye rig, blink, float, and tail animation controls.</p></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>(()=>{const fb=document.getElementById('fallback');if(!window.THREE){fb.textContent='Three.js could not load.';return}const T=THREE,scene=new T.Scene();scene.background=new T.Color(0x07101d);const cam=new T.PerspectiveCamera(34,innerWidth/innerHeight,.05,100),r=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});r.setPixelRatio(Math.min(devicePixelRatio||1,2));r.setSize(innerWidth,innerHeight);r.shadowMap.enabled=true;r.outputEncoding=T.sRGBEncoding;document.getElementById('app').appendChild(r.domElement);fb.style.display='none';scene.add(new T.HemisphereLight(0xd9eaff,0x261523,1.7));const key=new T.DirectionalLight(0xffe8f4,2);key.position.set(-4,7,-6);key.castShadow=true;scene.add(key);const floor=new T.Mesh(new T.CircleGeometry(8,96),new T.MeshStandardMaterial({color:0x202a38,roughness:.92}));floor.rotation.x=-Math.PI/2;floor.position.y=-2.2;floor.receiveShadow=true;scene.add(floor);const root=new T.Group(),tailRoot=new T.Group(),faceRoot=new T.Group(),capRoot=new T.Group();scene.add(root);root.add(tailRoot,faceRoot,capRoot);const C={pink:0xd98aa9,pink2:0xf1a5c1,blue:0x3b9fd0,white:0xf1eee7,black:0x080808,red:0x8e2948};const mat=(c,rough=.57)=>new T.MeshStandardMaterial({color:c,roughness:rough,metalness:.01});const M={pink:mat(C.pink),pink2:mat(C.pink2),blue:mat(C.blue,.52),white:mat(C.white,.45),black:mat(C.black,.38),red:mat(C.red,.5)};const sg=new T.SphereGeometry(1,12,9);function bead(parent,x,y,z,s,m){const o=new T.Mesh(sg,m);o.position.set(x,y,z);o.scale.setScalar(s);o.castShadow=true;parent.add(o);return o}function ellipsoid(parent,cx,cy,cz,rx,ry,rz,sp,sz,m){const rows=Math.max(8,Math.round(Math.PI*ry/sp));for(let j=1;j<rows;j++){const ph=Math.PI*j/rows,rr=Math.sin(ph),y=cy+Math.cos(ph)*ry,n=Math.max(8,Math.round(2*Math.PI*Math.max(rx,rz)*rr/sp));for(let i=0;i<n;i++){const a=i/n*Math.PI*2+(j%2)*Math.PI/n;bead(parent,cx+Math.cos(a)*rx*rr,y,cz+Math.sin(a)*rz*rr,sz,m)}}}ellipsoid(root,0,-.30,0,.92,.98,.84,.12,.064,M.pink);capRoot.position.y=.64;for(let q=0;q<=4;q++){const rr=.45+q*.10,n=Math.max(12,Math.round(2*Math.PI*rr/.11));for(let i=0;i<n;i++){const a=i/n*Math.PI*2;bead(capRoot,Math.cos(a)*rr,0,Math.sin(a)*rr,.055,M.white)}}for(let y=.02;y<=.52;y+=.10){const t=y/.52,rr=.49*(1-t*.45),n=Math.max(8,Math.round(2*Math.PI*rr/.11));for(let i=0;i<n;i++){const a=i/n*Math.PI*2+(Math.round(y/.1)%2)*Math.PI/n;bead(capRoot,Math.cos(a)*rr,y,Math.sin(a)*rr,.055,M.white)}}const brim=new T.Mesh(new T.BoxGeometry(1.0,.10,.30),M.white);brim.position.set(0,-.05,-.57);brim.rotation.x=.08;brim.castShadow=true;capRoot.add(brim);for(const x of [-.34,.34]){ellipsoid(faceRoot,x,.03,-.83,.22,.24,.09,.09,.046,M.white);bead(faceRoot,x,.03,-.99,.076,M.black)}const mouth=new T.Mesh(new T.TorusGeometry(.18,.035,8,30,Math.PI),M.red);mouth.rotation.z=Math.PI;mouth.position.set(0,-.45,-.92);faceRoot.add(mouth);const joints=[];for(let j=0;j<13;j++){const g=new T.Group();g.position.z=j===0?.75:.19;g.position.y=j===0?-.25:0;(j?joints[j-1]:tailRoot).add(g);joints.push(g);const rr=.48*(1-j/13)+.05,n=Math.max(6,Math.round(2*Math.PI*rr/.12));const mm=(j%4<2)?M.blue:M.white;for(let i=0;i<n;i++){const a=i/n*Math.PI*2;bead(g,Math.cos(a)*rr,Math.sin(a)*rr,0,.056,mm)}}let yaw=0,pitch=.05,dist=8.1,drag=false,lx=0,ly=0,auto=false,blinkT=0;function camera(){cam.position.set(Math.sin(yaw)*Math.cos(pitch)*dist,1+Math.sin(pitch)*dist,-Math.cos(yaw)*Math.cos(pitch)*dist);cam.lookAt(0,-.05,.65)}camera();const cv=r.domElement;cv.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-lx)*.008;pitch=Math.max(-.6,Math.min(.6,pitch+(e.clientY-ly)*.006));lx=e.clientX;ly=e.clientY;camera()});cv.addEventListener('pointerup',()=>drag=false);front.onclick=()=>{yaw=0;pitch=.02;dist=7.8;camera()};left.onclick=()=>{yaw=-Math.PI/2;pitch=.02;dist=8.5;camera()};three.onclick=()=>{yaw=-.65;pitch=.1;dist=8.3;camera()};spin.onclick=()=>auto=!auto;blink.onclick=()=>blinkT=.22;function loop(t){requestAnimationFrame(loop);const sp=+speed.value;if(auto){yaw-=.004*sp;camera()}root.position.y=Math.sin(t*.0015*sp)*(+float.value);const amp=+tail.value;joints.forEach((g,i)=>g.rotation.y=Math.sin(t*.008*sp-i*.52)*amp*(i/13));mouth.scale.y=.85+(+smile.value);if(blinkT>0){blinkT-=.016;faceRoot.scale.y=Math.max(.12,Math.abs(blinkT-.11)/.11)}else faceRoot.scale.y+=(1-faceRoot.scale.y)*.22;r.render(scene,cam)}loop(0);addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)})})();</script></body></html>
