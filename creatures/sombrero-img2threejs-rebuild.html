<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Sombrero Beaded Racer</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#07101d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#app{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}#ui{position:fixed;z-index:5;left:12px;top:12px;width:min(620px,calc(100vw - 24px));background:#04080edb;border:1px solid #ffffff20;border-radius:17px;padding:12px 14px;backdrop-filter:blur(12px)}h1{font-size:19px;margin:0 0 8px}.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}button{border:0;border-radius:10px;padding:8px 11px;font-weight:750;font-size:13px}label{font-size:11px;color:#b8c3d5;display:flex;align-items:center;gap:5px}input[type=range]{width:86px}p{font-size:12px;line-height:1.35;color:#aebdd0;margin:7px 0 0}#fallback{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:30px;color:#cad5e7}</style></head><body><div id="app"></div><div id="fallback">Loading Sombrero Beaded Racer…</div><div id="ui"><h1>Sombrero Beaded Racer</h1><div class="row"><button id="front">Front</button><button id="left">Left</button><button id="three">3/4</button><button id="spin">Auto rotate</button><button id="blink">Blink</button></div><div class="row" style="margin-top:8px"><label>Float <input id="float" type="range" min="0" max="0.18" step="0.01" value="0.05"></label><label>Tail <input id="tail" type="range" min="0" max="1.4" step="0.05" value="0.65"></label><label>Speed <input id="speed" type="range" min="0.2" max="3" step="0.1" value="1"></label></div><p>Same compact body and articulated tail proportions as Beaded Sailor, rebuilt with the darker reference palette and gap-free bead packing.</p></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>(()=>{const fb=document.getElementById('fallback');if(!window.THREE){fb.textContent='Three.js could not load.';return}const T=THREE,scene=new T.Scene();scene.background=new T.Color(0x07101d);const cam=new T.PerspectiveCamera(34,innerWidth/innerHeight,.05,100),r=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});r.setPixelRatio(Math.min(devicePixelRatio||1,2));r.setSize(innerWidth,innerHeight);r.shadowMap.enabled=true;r.outputEncoding=T.sRGBEncoding;r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=.82;document.getElementById('app').appendChild(r.domElement);fb.style.display='none';scene.add(new T.HemisphereLight(0xffd5a6,0x171b28,1.25));const key=new T.DirectionalLight(0xffdfad,2.15);key.position.set(-4,7,-6);key.castShadow=true;scene.add(key);const rim=new T.DirectionalLight(0x7d9ac7,.65);rim.position.set(5,2,4);scene.add(rim);const floor=new T.Mesh(new T.CircleGeometry(8,96),new T.MeshStandardMaterial({color:0x151a22,roughness:.96}));floor.rotation.x=-Math.PI/2;floor.position.y=-2.2;floor.receiveShadow=true;scene.add(floor);const root=new T.Group(),tailRoot=new T.Group(),faceRoot=new T.Group(),hatRoot=new T.Group();scene.add(root);root.add(tailRoot,faceRoot,hatRoot);const C={body:0x8f3f1f,body2:0xb65527,body3:0x6b2d18,hat:0xb8894d,hat2:0x7d572f,black:0x0b0908,white:0xe9dfd0,iris:0x3a1d12,red:0x7e1f18,green:0x315b34,gold:0xc5943a};const mat=(c,rough=.57)=>new T.MeshStandardMaterial({color:c,roughness:rough,metalness:.01});const M={body:mat(C.body,.52),body2:mat(C.body2,.5),body3:mat(C.body3,.62),hat:mat(C.hat,.72),hat2:mat(C.hat2,.76),black:mat(C.black,.38),white:mat(C.white,.58),iris:mat(C.iris,.45),red:mat(C.red,.62),green:mat(C.green,.62),gold:mat(C.gold,.58)};const sg=new T.SphereGeometry(1,12,10);function bead(parent,x,y,z,s,m,sx=1,sy=1,sz=1){const o=new T.Mesh(sg,m);o.position.set(x,y,z);o.scale.set(s*sx,s*sy,s*sz);o.castShadow=true;parent.add(o);return o}function ellipsoid(parent,cx,cy,cz,rx,ry,rz,sp,sz,m){const rows=Math.max(10,Math.round(Math.PI*ry/sp));for(let j=1;j<rows;j++){const ph=Math.PI*j/rows,rr=Math.sin(ph),y=cy+Math.cos(ph)*ry,n=Math.max(10,Math.round(2*Math.PI*Math.max(rx,rz)*rr/sp));for(let i=0;i<n;i++){const a=i/n*Math.PI*2+(j%2)*Math.PI/n;bead(parent,cx+Math.cos(a)*rx*rr,y,cz+Math.sin(a)*rz*rr,sz,m,1.08,1.02,1.08)}}}ellipsoid(root,0,-.30,0,.92,.98,.84,.095,.056,M.body);ellipsoid(root,0,-.32,.01,.83,.86,.75,.112,.054,M.body2);const brimY=.69;for(let q=0;q<7;q++){const rr=.48+q*.105,n=Math.max(18,Math.round(2*Math.PI*rr/.085));for(let i=0;i<n;i++){const a=i/n*Math.PI*2;const mm=q===3?M.red:(q===4?M.gold:M.hat);bead(hatRoot,Math.cos(a)*rr,brimY+(q-3)*.018,Math.sin(a)*rr,.049,mm,1.10,.82,1.10)}}for(let y=.72;y<=1.65;y+=.075){const t=(y-.72)/.93,rr=.52*(1-t*.55),n=Math.max(12,Math.round(2*Math.PI*rr/.082));for(let i=0;i<n;i++){const a=i/n*Math.PI*2+(Math.round(y/.075)%2)*Math.PI/n;bead(hatRoot,Math.cos(a)*rr,y,Math.sin(a)*rr,.047,M.hat,1.08,1.02,1.08)}}for(let i=0;i<30;i++){const a=i/30*Math.PI*2;const mm=i%3===0?M.red:(i%3===1?M.green:M.gold);bead(hatRoot,Math.cos(a)*.735,.765,Math.sin(a)*.735,.045,mm,1.05,.95,1.05)}for(const x of [-.34,.34]){ellipsoid(faceRoot,x,.03,-.83,.23,.25,.10,.078,.043,M.white);bead(faceRoot,x,.02,-.985,.078,M.iris);bead(faceRoot,x,.02,-1.045,.042,M.black)}function brow(x){for(let i=0;i<8;i++){const t=i/7;bead(faceRoot,x+(t-.5)*.42,.39+.07*Math.sin(t*Math.PI),-.93,.050,M.black,1.15,.95,.8)}}brow(-.34);brow(.34);function mustacheSide(s,y){for(let row=0;row<4;row++){for(let i=0;i<12;i++){const t=i/11,x=s*(.04+t*.73),yy=y-row*.07-.15*Math.sin(t*Math.PI),z=-.99-.015*row;bead(faceRoot,x,yy,z,.054,M.black,1.12,.92,.86)}}}mustacheSide(-1,-.20);mustacheSide(1,-.20);for(let i=0;i<7;i++){const a=i/6*Math.PI;bead(faceRoot,Math.cos(a)*.17,-.19-Math.sin(a)*.10,-1.00,.056,M.black,1.1,.95,.85)}const joints=[];for(let j=0;j<16;j++){const g=new T.Group();g.position.z=j===0?.72:.155;g.position.y=j===0?-.26:0;(j?joints[j-1]:tailRoot).add(g);joints.push(g);const rr=.46*(1-j/16)+.045,n=Math.max(10,Math.round(2*Math.PI*rr/.086));for(let ring=0;ring<2;ring++){for(let i=0;i<n;i++){const a=i/n*Math.PI*2+(ring%2)*Math.PI/n;bead(g,Math.cos(a)*rr,Math.sin(a)*rr,(ring-.5)*.055,.050,j%5===0?M.body3:(j%3===0?M.body2:M.body),1.08,1.08,1.08)}}}let yaw=0,pitch=.05,dist=8.1,drag=false,lx=0,ly=0,auto=false,blinkT=0;function camera(){cam.position.set(Math.sin(yaw)*Math.cos(pitch)*dist,1+Math.sin(pitch)*dist,-Math.cos(yaw)*Math.cos(pitch)*dist);cam.lookAt(0,-.05,.65)}camera();const cv=r.domElement;cv.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-lx)*.008;pitch=Math.max(-.6,Math.min(.6,pitch+(e.clientY-ly)*.006));lx=e.clientX;ly=e.clientY;camera()});cv.addEventListener('pointerup',()=>drag=false);front.onclick=()=>{yaw=0;pitch=.02;dist=7.8;camera()};left.onclick=()=>{yaw=-Math.PI/2;pitch=.02;dist=8.5;camera()};three.onclick=()=>{yaw=-.65;pitch=.1;dist=8.3;camera()};spin.onclick=()=>auto=!auto;blink.onclick=()=>blinkT=.22;function loop(t){requestAnimationFrame(loop);const sp=+speed.value;if(auto){yaw-=.004*sp;camera()}root.position.y=Math.sin(t*.0015*sp)*(+float.value);const amp=+tail.value;joints.forEach((g,i)=>g.rotation.y=Math.sin(t*.0075*sp-i*.46)*amp*(i/16));if(blinkT>0){blinkT-=.016;faceRoot.scale.y=Math.max(.12,Math.abs(blinkT-.11)/.11)}else faceRoot.scale.y+=(1-faceRoot.scale.y)*.22;r.render(scene,cam)}loop(0);addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)})})();</script></body></html>
