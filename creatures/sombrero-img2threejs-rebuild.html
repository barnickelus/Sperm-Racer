<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Sombrero Actor — Sailor Body Rebuild</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#07101d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#app{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}#ui{position:fixed;z-index:5;left:12px;top:12px;width:min(620px,calc(100vw - 24px));background:#04080edb;border:1px solid #ffffff20;border-radius:17px;padding:12px 14px;backdrop-filter:blur(12px)}h1{font-size:19px;margin:0 0 8px}.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}button{border:0;border-radius:10px;padding:8px 11px;font-weight:750;font-size:13px}label{font-size:11px;color:#b8c3d5;display:flex;align-items:center;gap:5px}input[type=range]{width:86px}p{font-size:12px;line-height:1.35;color:#aebdd0;margin:7px 0 0}#fallback{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:30px;color:#cad5e7}</style></head><body><div id="app"></div><div id="fallback">Loading Sombrero Actor…</div><div id="ui"><h1>Sombrero Actor — Beaded Sailor Body</h1><div class="row"><button id="front">Front</button><button id="left">Left</button><button id="three">3/4</button><button id="spin">Auto rotate</button><button id="blink">Blink</button></div><div class="row" style="margin-top:8px"><label>Float <input id="float" type="range" min="0" max="0.18" step="0.01" value="0.06"></label><label>Tail <input id="tail" type="range" min="0" max="1.4" step="0.05" value="0.75"></label><label>Speed <input id="speed" type="range" min="0.2" max="3" step="0.1" value="1"></label></div><p>Same generic body and articulated tail proportions as the Beaded Sailor, with a fitted straw sombrero, brows, eyes, and layered mustache.</p></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>(()=>{const fb=document.getElementById('fallback');if(!window.THREE){fb.textContent='Three.js could not load.';return}const T=THREE,scene=new T.Scene();scene.background=new T.Color(0x07101d);const cam=new T.PerspectiveCamera(34,innerWidth/innerHeight,.05,100),r=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});r.setPixelRatio(Math.min(devicePixelRatio||1,2));r.setSize(innerWidth,innerHeight);r.shadowMap.enabled=true;r.outputEncoding=T.sRGBEncoding;r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=.92;document.getElementById('app').appendChild(r.domElement);fb.style.display='none';scene.add(new T.HemisphereLight(0xffe0c7,0x211827,1.4));const key=new T.DirectionalLight(0xffdfbd,1.8);key.position.set(-4,7,-6);key.castShadow=true;scene.add(key);const fill=new T.DirectionalLight(0x7ba2d5,.85);fill.position.set(5,2,-2);scene.add(fill);const floor=new T.Mesh(new T.CircleGeometry(8,96),new T.MeshStandardMaterial({color:0x202a38,roughness:.92}));floor.rotation.x=-Math.PI/2;floor.position.y=-2.2;floor.receiveShadow=true;scene.add(floor);const root=new T.Group(),tailRoot=new T.Group(),faceRoot=new T.Group(),hatRoot=new T.Group(),moustacheRoot=new T.Group();scene.add(root);root.add(tailRoot,faceRoot,hatRoot,moustacheRoot);const C={body:0xb86536,body2:0xd77b43,straw:0xc9924b,straw2:0x8b552a,white:0xefe7d8,black:0x0a0908,iris:0x4a281a};const mat=(c,rough=.57)=>new T.MeshStandardMaterial({color:c,roughness:rough,metalness:.01});const M={body:mat(C.body,.7),body2:mat(C.body2,.66),straw:mat(C.straw,.82),straw2:mat(C.straw2,.82),white:mat(C.white,.52),black:mat(C.black,.38),iris:mat(C.iris,.48)};const sg=new T.SphereGeometry(1,12,9);function bead(parent,x,y,z,s,m){const o=new T.Mesh(sg,m);o.position.set(x,y,z);o.scale.setScalar(s);o.castShadow=true;parent.add(o);return o}function ellipsoid(parent,cx,cy,cz,rx,ry,rz,sp,sz,m){const rows=Math.max(8,Math.round(Math.PI*ry/sp));for(let j=1;j<rows;j++){const ph=Math.PI*j/rows,rr=Math.sin(ph),y=cy+Math.cos(ph)*ry,n=Math.max(8,Math.round(2*Math.PI*Math.max(rx,rz)*rr/sp));for(let i=0;i<n;i++){const a=i/n*Math.PI*2+(j%2)*Math.PI/n;bead(parent,cx+Math.cos(a)*rx*rr,y,cz+Math.sin(a)*rz*rr,sz,m)}}}function tube(parent,pts,rad,m,rings=7){for(let i=0;i<pts.length;i++){const p=pts[i],q=pts[Math.min(i+1,pts.length-1)],tan=new T.Vector3().subVectors(q,p).normalize(),n1=new T.Vector3(0,1,0).cross(tan);if(n1.lengthSq()<.01)n1.set(1,0,0);n1.normalize();const n2=new T.Vector3().crossVectors(tan,n1).normalize();for(let j=0;j<rings;j++){const a=j/rings*Math.PI*2;bead(parent,p.x+n1.x*Math.cos(a)*rad+n2.x*Math.sin(a)*rad,p.y+n1.y*Math.cos(a)*rad+n2.y*Math.sin(a)*rad,p.z+n1.z*Math.cos(a)*rad+n2.z*Math.sin(a)*rad,.053,m)}}}function bezierPoints(p0,p1,p2,p3,steps=20){const out=[];for(let i=0;i<=steps;i++){const t=i/steps,it=1-t;out.push(new T.Vector3().addScaledVector(p0,it*it*it).addScaledVector(p1,3*it*it*t).addScaledVector(p2,3*it*t*t).addScaledVector(p3,t*t*t))}return out}ellipsoid(root,0,-.30,0,.92,.98,.84,.12,.064,M.body);ellipsoid(root,0,-.38,.02,.78,.70,.67,.15,.058,M.body2);hatRoot.position.y=.57;for(let q=0;q<=4;q++){const rr=.56+q*.11,n=Math.max(16,Math.round(2*Math.PI*rr/.11));for(let i=0;i<n;i++){const a=i/n*Math.PI*2;bead(hatRoot,Math.cos(a)*rr,0,Math.sin(a)*rr,.055,q<2?M.straw2:M.straw)}}for(let y=.04;y<=.62;y+=.10){const t=y/.62,rr=.52*(1-t*.50),n=Math.max(10,Math.round(2*Math.PI*rr/.11));for(let i=0;i<n;i++){const a=i/n*Math.PI*2+(Math.round(y/.1)%2)*Math.PI/n;bead(hatRoot,Math.cos(a)*rr,y,Math.sin(a)*rr,.055,M.straw)}}for(const x of [-.34,.34]){ellipsoid(faceRoot,x,.03,-.83,.22,.24,.09,.09,.046,M.white);bead(faceRoot,x,.03,-.99,.078,M.iris);bead(faceRoot,x,.03,-1.05,.038,M.black)}for(const x of [-.34,.34]){const s=Math.sign(x),pts=bezierPoints(new T.Vector3(x-.19*s,.31,-.94),new T.Vector3(x-.08*s,.43,-.99),new T.Vector3(x+.08*s,.43,-.99),new T.Vector3(x+.19*s,.31,-.94),12);tube(faceRoot,pts,.042,M.black,6)}function moustacheSide(s,y,z,rad){return bezierPoints(new T.Vector3(.02*s,y,z),new T.Vector3(.28*s,y-.08,z-.03),new T.Vector3(.55*s,y-.11,z-.02),new T.Vector3(.68*s,y+.12,z),20)}tube(moustacheRoot,moustacheSide(-1,-.20,-.97,.10),.10,M.black,7);tube(moustacheRoot,moustacheSide(1,-.20,-.97,.10),.10,M.black,7);tube(moustacheRoot,moustacheSide(-1,-.33,-.96,.08),.075,M.black,7);tube(moustacheRoot,moustacheSide(1,-.33,-.96,.08),.075,M.black,7);ellipsoid(moustacheRoot,0,-.23,-.98,.16,.13,.06,.10,.045,M.black);const joints=[];for(let j=0;j<13;j++){const g=new T.Group();g.position.z=j===0?.75:.19;g.position.y=j===0?-.25:0;(j?joints[j-1]:tailRoot).add(g);joints.push(g);const rr=.48*(1-j/13)+.05,n=Math.max(6,Math.round(2*Math.PI*rr/.12));const mm=j%3===0?M.body2:M.body;for(let i=0;i<n;i++){const a=i/n*Math.PI*2;bead(g,Math.cos(a)*rr,Math.sin(a)*rr,0,.056,mm)}}let yaw=0,pitch=.05,dist=8.1,drag=false,lx=0,ly=0,auto=false,blinkT=0;function camera(){cam.position.set(Math.sin(yaw)*Math.cos(pitch)*dist,1+Math.sin(pitch)*dist,-Math.cos(yaw)*Math.cos(pitch)*dist);cam.lookAt(0,-.05,.65)}camera();const cv=r.domElement;cv.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-lx)*.008;pitch=Math.max(-.6,Math.min(.6,pitch+(e.clientY-ly)*.006));lx=e.clientX;ly=e.clientY;camera()});cv.addEventListener('pointerup',()=>drag=false);front.onclick=()=>{yaw=0;pitch=.02;dist=7.8;camera()};left.onclick=()=>{yaw=-Math.PI/2;pitch=.02;dist=8.5;camera()};three.onclick=()=>{yaw=-.65;pitch=.1;dist=8.3;camera()};spin.onclick=()=>auto=!auto;blink.onclick=()=>blinkT=.22;function loop(t){requestAnimationFrame(loop);const sp=+speed.value;if(auto){yaw-=.004*sp;camera()}root.position.y=Math.sin(t*.0015*sp)*(+float.value);const amp=+tail.value;joints.forEach((g,i)=>g.rotation.y=Math.sin(t*.008*sp-i*.52)*amp*(i/13));if(blinkT>0){blinkT-=.016;faceRoot.scale.y=Math.max(.12,Math.abs(blinkT-.11)/.11)}else faceRoot.scale.y+=(1-faceRoot.scale.y)*.22;r.render(scene,cam)}loop(0);addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)})})();</script></body></html>
