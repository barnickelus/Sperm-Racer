<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Meshy Beaded Sombrero Man</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07101d;color:#eef5ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#stage{position:absolute;inset:0}#hud{position:fixed;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;gap:12px;pointer-events:none}.panel{background:#07101dcc;border:1px solid #2c455f;border-radius:12px;padding:10px 12px;backdrop-filter:blur(10px)}h1{font-size:16px;margin:0 0 4px}.muted{font-size:12px;color:#a8b9cd}.error{color:#ffbd79}.ok{color:#9be74e}</style></head><body><div id="stage"></div><div id="hud"><div class="panel"><h1>Meshy Beaded Sombrero Man</h1><div class="muted">Drag to orbit · pinch or wheel to zoom</div></div><div class="panel"><div id="status" class="muted">Loading optimized GLB…</div></div></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js';import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/controls/OrbitControls.js';import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/loaders/GLTFLoader.js';const host=document.querySelector('#stage'),status=document.querySelector('#status');const scene=new THREE.Scene();scene.background=new THREE.Color(0x07101d);const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.01,100);camera.position.set(0,.15,4);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;host.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xdcecff,0x223044,2.1));const key=new THREE.DirectionalLight(0xffffff,3.2);key.position.set(3,4,5);scene.add(key);const rim=new THREE.DirectionalLight(0x7fc8ff,2.2);rim.position.set(-4,1,-3);scene.add(rim);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,.15,0);const loader=new GLTFLoader();loader.load('models/meshy_beaded_sombrero_game_ready.glb',g=>{const root=g.scene;scene.add(root);const box=new THREE.Box3().setFromObject(root),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());root.position.sub(center);const max=Math.max(size.x,size.y,size.z);const s=2.4/max;root.scale.setScalar(s);const framed=new THREE.Box3().setFromObject(root);const c=framed.getCenter(new THREE.Vector3());root.position.sub(c);controls.target.set(0,0,0);camera.position.set(0,.1,4);status.textContent='Loaded · optimized game-ready mesh';status.className='muted ok';},e=>{if(e.total)status.textContent=`Loading ${Math.round(e.loaded/e.total*100)}%`;},err=>{console.error(err);status.textContent='Model file is not uploaded yet';status.className='muted error';});function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);const clock=new THREE.Clock();function tick(){requestAnimationFrame(tick);controls.update();scene.rotation.y=Math.sin(clock.getElapsedTime()*.35)*.08;renderer.render(scene,camera)}tick();</script></body></html>
