<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05202a">
<title>Sperm Racer — Juan Stallion Drive Demo</title>
<style>
  :root{ --signal:#6df2d0; --bone:#eafff8; --ink:#8fb7b0; --dim:#2b6e66; --gold:#ffb44a; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;
    -webkit-user-select:none;-webkit-touch-callout:none;}
  *:focus{outline:none;}
  ::selection{background:transparent;}
  html,body{margin:0;height:100%;background:#05202a;overflow:hidden;touch-action:none;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--bone);overscroll-behavior:none;}
  #app{position:fixed;inset:0;}
  #app canvas{display:block;width:100%!important;height:100%!important;touch-action:none;}

  /* ===== HUD ===== */
  #ui{position:fixed;inset:0;pointer-events:none;z-index:3;}
  .glass{background:linear-gradient(160deg,rgba(8,34,42,.55),rgba(5,22,28,.35));
    border:1px solid rgba(109,242,208,.22);border-radius:12px;
    box-shadow:0 6px 24px rgba(0,0,0,.35), inset 0 1px 0 rgba(234,255,248,.06);
    backdrop-filter:blur(6px);}
  .hud{position:absolute;text-transform:uppercase;letter-spacing:.14em;}

  #tag{top:env(safe-area-inset-top,12px);left:0;right:0;text-align:center;
    font-size:12px;letter-spacing:.28em;opacity:.9;pointer-events:none;}
  #tag b{color:var(--gold);}

  #speedo{top:calc(env(safe-area-inset-top,12px) + 26px);left:14px;padding:8px 14px;text-align:left;}
  #speedo .lbl{font-size:10px;color:var(--ink);letter-spacing:.2em;}
  #speedo b{display:block;font-size:34px;line-height:1;color:var(--bone);
    font-variant-numeric:tabular-nums;text-shadow:0 0 16px rgba(109,242,208,.4);
    transition:color .15s,text-shadow .15s;}
  #speedo.boost b{color:#ffd48a;text-shadow:0 0 20px rgba(255,178,74,.85);}

  #boostmeter{top:calc(env(safe-area-inset-top,12px) + 26px);right:14px;padding:8px 14px;text-align:right;width:150px;}
  #boostmeter .lbl{font-size:10px;color:var(--ink);letter-spacing:.2em;}
  #bmTrack{margin-top:6px;height:8px;border-radius:5px;background:rgba(0,0,0,.35);
    border:1px solid rgba(109,242,208,.25);overflow:hidden;}
  #bmFill{height:100%;width:0%;background:linear-gradient(90deg,#2b6e66,var(--signal));
    box-shadow:0 0 10px rgba(109,242,208,.6);transition:width .08s linear;}
  #bmFill.full{background:linear-gradient(90deg,#ffb44a,#ffe6ab);box-shadow:0 0 14px rgba(255,180,74,.85);}

  #split{top:104px;left:0;right:0;text-align:center;font-size:13px;letter-spacing:.24em;
    color:var(--gold);opacity:0;transition:opacity .3s ease;pointer-events:none;
    text-shadow:0 0 14px rgba(255,180,74,.6);}
  #split.show{opacity:1;}

  #status{bottom:calc(env(safe-area-inset-bottom,14px) + 120px);left:0;right:0;
    text-align:center;font-size:13px;letter-spacing:.25em;color:var(--ink);pointer-events:none;}

  #hint{bottom:calc(env(safe-area-inset-bottom,14px) + 96px);left:0;right:0;text-align:center;
    font-size:11px;letter-spacing:.06em;opacity:.55;pointer-events:none;}

  #finish{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;background:radial-gradient(circle at 50% 42%,rgba(6,30,38,.8),rgba(3,16,21,.96));
    pointer-events:auto;z-index:10;text-align:center;padding:24px;}
  #finish.show{display:flex;}
  #finish .tag{color:var(--gold);letter-spacing:.4em;font-size:11px;text-transform:uppercase;}
  #finish h1{margin:0;font-size:clamp(30px,9vw,58px);letter-spacing:.04em;font-weight:700;
    text-shadow:0 0 30px rgba(255,180,74,.4);}
  #finish p{color:var(--ink);font-size:13px;letter-spacing:.05em;margin:0;}
  #finish button{margin-top:8px;pointer-events:auto;cursor:pointer;font-family:inherit;background:var(--signal);
    color:#04201b;border:none;padding:14px 38px;border-radius:30px;font-size:13px;letter-spacing:.2em;
    text-transform:uppercase;font-weight:700;}

  /* ===== atmosphere overlays ===== */
  #fx{position:fixed;inset:0;pointer-events:none;z-index:2;}
  #vignette{position:absolute;inset:0;
    box-shadow:inset 0 0 200px 30px rgba(2,12,16,.8), inset 0 0 60px rgba(2,12,16,.45);
    transition:box-shadow .25s ease;}
  #speedlines{position:absolute;inset:-20%;opacity:0;transition:opacity .12s linear;
    background:
      radial-gradient(circle at 50% 50%, transparent 38%, rgba(109,242,208,.0) 38%, rgba(109,242,208,.10) 70%, transparent 71%),
      repeating-conic-gradient(from 0deg at 50% 50%, rgba(234,255,248,.14) 0deg 1.2deg, transparent 1.2deg 7deg);
    -webkit-mask-image:radial-gradient(circle at 50% 50%, transparent 40%, #000 78%);
            mask-image:radial-gradient(circle at 50% 50%, transparent 40%, #000 78%);
    animation:spin 8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  #boostflash{position:absolute;inset:0;background:radial-gradient(circle at 50% 60%,rgba(255,210,120,.0),transparent 60%);
    opacity:0;transition:opacity .35s ease;}
  #boostflash.on{opacity:1;background:radial-gradient(circle at 50% 60%,rgba(255,210,120,.45),transparent 62%);}

  /* ===== touch controls ===== */
  .pad{position:absolute;bottom:calc(env(safe-area-inset-bottom,16px) + 10px);pointer-events:auto;display:none;}
  body.touch .pad{display:block;}
  #joyZone{left:18px;width:130px;height:130px;border-radius:50%;
    border:2px solid var(--dim);background:rgba(13,48,56,.4);}
  #joyKnob{position:absolute;left:50%;top:50%;width:56px;height:56px;border-radius:50%;
    background:rgba(109,242,208,.28);border:2px solid var(--signal);
    box-shadow:0 0 15px rgba(109,242,208,.35);transform:translate(-50%,-50%);}
  #boostbtn{right:22px;width:96px;height:96px;border-radius:50%;
    border:2px solid var(--signal);color:var(--signal);background:rgba(13,48,56,.55);
    backdrop-filter:blur(3px);font-family:inherit;letter-spacing:.1em;text-transform:uppercase;
    font-size:14px;font-weight:700;box-shadow:0 0 15px rgba(109,242,208,.2);
    display:flex;align-items:center;justify-content:center;}
  #boostbtn:active,#boostbtn.active{background:rgba(255,180,74,.35);border-color:#ffb44a;color:#ffb44a;transform:scale(.95);}

  @media (max-width:400px){
    #boostmeter{width:120px;}
    #joyZone{width:110px;height:110px;}
    #boostbtn{width:82px;height:82px;font-size:12px;}
  }

  /* inspect / free-orbit toggle — matches the glass HUD, teal signal */
  #inspectBtn{position:fixed;top:calc(env(safe-area-inset-top,12px) + 44px);left:50%;
    transform:translateX(-50%);z-index:5;pointer-events:auto;cursor:pointer;
    font-family:inherit;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;
    color:var(--signal);border:1px solid rgba(109,242,208,.4);border-radius:20px;padding:8px 16px;}
  #inspectBtn:active{transform:translateX(-50%) scale(.96);}
  #inspectBtn.on{color:#ffd48a;border-color:rgba(255,180,74,.55);}
  body.inspect .pad{display:none!important;}      /* hide joystick + boost while orbiting */
  body.inspect #hint{opacity:0;}
</style>
</head>
<body>
<div id="app"><canvas id="c"></canvas></div>

<div id="fx">
  <div id="speedlines"></div>
  <div id="boostflash"></div>
  <div id="vignette"></div>
</div>

<div id="ui">
  <div id="tag" class="hud">Sperm Racer — <b>Juan Stallion</b> Drive Demo</div>
  <div id="speedo" class="hud glass">
    <div class="lbl">Speed</div>
    <b id="speedVal">0</b>
  </div>
  <div id="boostmeter" class="hud glass">
    <div class="lbl">Boost</div>
    <div id="bmTrack"><div id="bmFill"></div></div>
  </div>
  <div id="split" class="hud">Checkpoint!</div>
  <div id="status" class="hud">Swim to the start line</div>
  <div id="hint" class="hud">Arrows/WASD steer &amp; throttle · Space/Shift boost · drag joystick + tap BOOST on touch</div>
</div>

<button id="inspectBtn" class="glass">🔍 Inspect</button>

<div class="pad" id="joyZone"><div id="joyKnob"></div></div>
<button class="pad" id="boostbtn">Boost</button>

<div id="finish">
  <div class="tag">Finish</div>
  <h1 id="finishTitle">¡Órale! Course Complete</h1>
  <p id="finishTime">Time: 0.0s</p>
  <button id="againBtn">Swim Again</button>
</div>

<script src="three.min.js"></script>
<script>
(function(){
'use strict';
const T = THREE;

// ================= renderer / scene / camera =================
const canvas = document.getElementById('c');
const renderer = new T.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.outputEncoding = T.sRGBEncoding;

const scene = new T.Scene();

// World-mood colors. The WATER zone reads teal / deep-blue; crossing the transition eases
// both the fog and the background toward Felicia's felt sky (deep magenta 0x3a1440), so
// entering the felt section visibly changes the world. Depth fog stays on so distance reads.
const WATER_BG  = new T.Color(0x063040), FELT_BG  = new T.Color(0x3a1440);
const WATER_FOG = new T.Color(0x05263a), FELT_FOG = new T.Color(0x3a1440);
scene.background = WATER_BG.clone();
scene.fog = new T.Fog(WATER_FOG.clone(), 70, 430);   // color eased per-frame at the transition

const cam = new T.PerspectiveCamera(58, 1, 0.1, 3000);
const BASE_FOV = 58, BOOST_FOV = 72;

function resize(){
  const w = document.documentElement.clientWidth, h = document.documentElement.clientHeight;
  renderer.setSize(w, h, false);
  cam.aspect = w / h;
  cam.updateProjectionMatrix();
}
addEventListener('resize', resize);

// ================= lighting =================
scene.add(new T.AmbientLight(0xbfd8e0, 0.6));
const key = new T.DirectionalLight(0xffffff, 0.95); key.position.set(50, 90, 60); scene.add(key);
const fill = new T.DirectionalLight(0xff9ec4, 0.32); fill.position.set(-40, 20, -30); scene.add(fill);
const rim = new T.DirectionalLight(0x6df2d0, 0.28); rim.position.set(0, 30, -80); scene.add(rim);

// small texture helper (procedural, offline) ---------------------------------
function makeChecker(a, b, cells){
  const px = 8, cv = document.createElement('canvas'); cv.width = cv.height = px*cells;
  const ctx = cv.getContext('2d');
  for (let y = 0; y < cells; y++) for (let x = 0; x < cells; x++){
    ctx.fillStyle = ((x + y) & 1) ? a : b;
    ctx.fillRect(x*px, y*px, px, px);
  }
  const tex = new T.CanvasTexture(cv); tex.encoding = T.sRGBEncoding;
  tex.wrapS = tex.wrapT = T.RepeatWrapping; return tex;
}

// ================= course: two sections on one continuous Catmull-Rom lane =================
// First half = WATER (plankton). Second half = FELICIA, the needle-felted WOOL world.
// The felt control points continue smoothly out of the water end so the lane never breaks.
const CTRL = [
  // --- water section ---
  [0, 0], [8, -60], [-10, -140], [22, -230], [6, -320],
  [-18, -410], [14, -500], [0, -580],
  // --- felt section (curves off through the wool valley to a new finish) ---
  [16, -650], [40, -720], [22, -800], [-14, -884], [-42, -968],
  [-20, -1058], [26, -1146], [12, -1226], [-8, -1300]
];
const ctrlPts = CTRL.map(p => new T.Vector3(p[0], 0, p[1]));
const laneCurve = new T.CatmullRomCurve3(ctrlPts, false, 'catmullrom', 0.4);
const LANE_SAMPLES = 500;
const lanePts = [];
for (let i = 0; i <= LANE_SAMPLES; i++){
  const t = i / LANE_SAMPLES;
  const p = laneCurve.getPoint(t);
  const tan = laneCurve.getTangent(t);
  lanePts.push({ x: p.x, z: p.z, tx: tan.x, tz: tan.z, u: t });
}
const LANE_HW = 15;

function nearestLane(x, z){
  let bi = 0, bd = Infinity;
  for (let i = 0; i < lanePts.length; i += 4){
    const p = lanePts[i], d = (p.x-x)*(p.x-x) + (p.z-z)*(p.z-z);
    if (d < bd){ bd = d; bi = i; }
  }
  const lo = Math.max(0, bi-4), hi = Math.min(lanePts.length-1, bi+4);
  for (let i = lo; i <= hi; i++){
    const p = lanePts[i], d = (p.x-x)*(p.x-x) + (p.z-z)*(p.z-z);
    if (d < bd){ bd = d; bi = i; }
  }
  return { i: bi, dist: Math.sqrt(bd), pt: lanePts[bi] };
}

// ---- transition point: where WATER becomes FELT (nearest sample to the felt entry) ----
let FELT_U = 0.5;
(function(){
  let bi = 0, bd = Infinity;
  for (let i = 0; i < lanePts.length; i++){
    const p = lanePts[i], d = (p.x-6)*(p.x-6) + (p.z+615)*(p.z+615); // ~ just past the water end
    if (d < bd){ bd = d; bi = i; }
  }
  FELT_U = lanePts[bi].u;
})();

// ================= FELICIA felt kit (values matched to the game) =================
const FELT_PAL  = [0xe8e4d9,0xa9b8a0,0x5a6b84,0x1b2350,0x2438a8,0xc4207e,0xe8408c,
                   0xc11b2e,0xe23a2a,0xe86a22,0xe8b22a,0x1f6b70,0x3a1440,0x170a24];
const FELT_WOOL = [0xe8408c,0xc4207e,0xc11b2e,0xe23a2a,0x8f9c72,0xa9b8a0,0xe8e4d9,0x5a6b84];
const FELT_YARN = [0x2438a8,0x1b2350,0x3a1440,0xc11b2e,0xe8408c,0x170a24,0x1f6b70];

// Raw tuft: an icosahedron pushed off-sphere by a hash so no two puffs read alike.
const FELT_PUFF = (function(){
  const g = new T.IcosahedronGeometry(1,1), p = g.attributes.position, v = new T.Vector3();
  for (let i = 0; i < p.count; i++){
    v.fromBufferAttribute(p, i);
    const h = Math.sin(v.x*12.9898 + v.y*78.233 + v.z*37.719) * 43758.5453;
    v.multiplyScalar(0.74 + (h - Math.floor(h))*0.44);
    p.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals(); return g;
})();

// Warped color-strata sheet: poster bands domain-warped so they wobble like poured felt.
function feltStrataTex(){
  const c = document.createElement('canvas'); c.width = 128; c.height = 512;
  const g = c.getContext('2d');
  const warp = y => Math.sin(y*0.035)*9 + Math.sin(y*0.011+2.1)*16 + Math.sin(y*0.083+0.7)*4;
  for (let y = 0; y < 512; y++){
    const band = Math.floor((y + warp(y))/22);
    const col = FELT_PAL[((band % FELT_PAL.length) + FELT_PAL.length) % FELT_PAL.length];
    g.fillStyle = '#' + col.toString(16).padStart(6,'0');
    g.fillRect(0, y, 128, 1);
    const f = ((y + warp(y))/22) % 1;
    if (f < 0.09){ g.fillStyle = 'rgba(232,228,217,0.40)'; g.fillRect(0, y, 128, 1); }      // pressed light lip
    else if (f > 0.93){ g.fillStyle = 'rgba(0,0,0,0.30)'; g.fillRect(0, y, 128, 1); }        // dark lip
  }
  g.globalAlpha = 0.06;                                   // scattered felt fuzz
  for (let i = 0; i < 2600; i++){
    g.fillStyle = Math.random() < 0.5 ? '#000' : '#fff';
    g.fillRect(Math.random()*128, Math.random()*512, 1, 1);
  }
  g.globalAlpha = 1;
  const t = new T.CanvasTexture(c); t.wrapS = t.wrapT = T.RepeatWrapping;
  t.encoding = T.sRGBEncoding; t.needsUpdate = true; return t;
}
// Matte, unlit-ish fibre — felt has NO specular/metalness at all (that is most of the look).
function feltMat(hex, map){
  return new T.MeshLambertMaterial({ color:hex, map:map||null, flatShading:true });
}
// Batch a list of tufts {x,y,z,s,sy,sz,c,rx,ry,rz} into ONE instanced draw.
function feltBatch(geo, list){
  const m = new T.InstancedMesh(geo, feltMat(0xffffff), list.length); m.frustumCulled = false;
  const d = new T.Object3D(), c = new T.Color();
  list.forEach((v,i) => {
    d.position.set(v.x, v.y, v.z);
    d.rotation.set(v.rx||0, v.ry||0, v.rz||0);
    d.scale.set(v.s, v.sy!=null?v.sy:v.s, v.sz!=null?v.sz:v.s);
    d.updateMatrix(); m.setMatrixAt(i, d.matrix);
    c.setHex(v.c); m.setColorAt(i, c);
  });
  m.instanceMatrix.needsUpdate = true;
  if (m.instanceColor) m.instanceColor.needsUpdate = true;
  return m;
}
const feltTex = feltStrataTex();
const tuftList = [];        // every wool tuft (walls, berms, transition) -> one instanced draw

// ---- floor + walls as InstancedMesh cube fields (few draw calls) ----
const courseGroup = new T.Group(); scene.add(courseGroup);
function makeBoxField(list, size, matOpts){
  const n = list.length;
  const geo = new T.BoxGeometry(1,1,1);
  const mat = new T.MeshStandardMaterial(Object.assign({ vertexColors:true, roughness:0.85, metalness:0.05 }, matOpts||{}));
  const mesh = new T.InstancedMesh(geo, mat, n);
  const dummy = new T.Object3D(), color = new T.Color();
  for (let i = 0; i < n; i++){
    const v = list[i];
    dummy.position.set(v.x, v.y, v.z);
    dummy.scale.set(size, size, size);
    dummy.updateMatrix(); mesh.setMatrixAt(i, dummy.matrix);
    color.setRGB(v.r/255, v.g/255, v.b/255); mesh.setColorAt(i, color);
  }
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  return mesh;
}

(function buildCourse(){
  const floorVox = [], wallVox = [];
  const track1 = [233,152,180], track2 = [214,126,160];
  const wallLo = [58,26,52], wallHi = [150,72,120];
  const step = 6;
  for (let i = 0; i < lanePts.length; i += 2){
    const p = lanePts[i];
    if (p.u >= FELT_U) continue;                 // felt section builds its own floor/walls
    const nx = -p.tz, nz = p.tx;
    for (let w = -LANE_HW; w <= LANE_HW; w += step){
      const x = p.x + nx*w, z = p.z + nz*w;
      const c = (((Math.round(x/step) + Math.round(z/step)) & 1)) ? track1 : track2;
      floorVox.push({ x, y: -1, z, r:c[0], g:c[1], b:c[2] });
    }
    // side walls: gradient dark base -> lighter magenta top
    if (i % 8 === 0){
      for (const side of [-1, 1]){
        const bx = p.x + nx*(LANE_HW+2)*side, bz = p.z + nz*(LANE_HW+2)*side;
        for (let y = 0; y <= 3; y++){
          const f = y/3;
          wallVox.push({
            x:bx, y, z:bz,
            r:Math.round(wallLo[0]+(wallHi[0]-wallLo[0])*f),
            g:Math.round(wallLo[1]+(wallHi[1]-wallLo[1])*f),
            b:Math.round(wallLo[2]+(wallHi[2]-wallLo[2])*f)
          });
        }
      }
    }
  }
  courseGroup.add(makeBoxField(floorVox, 5.2));
  courseGroup.add(makeBoxField(wallVox, 2.2, { emissive:0x2a0e26, emissiveIntensity:0.35 }));
})();

// ---- FELICIA felt section: warped-strata felt road ribbon + wool-tuft walls/berms ----
const feltGroup = new T.Group(); scene.add(feltGroup);
(function buildFeltSection(){
  // felt road: a triangle-strip ribbon following the lane, mapped with the strata sheet so
  // the warped color bands run across the lane (a cross-section through felted tissue).
  const pos = [], uv = [], idx = [];
  let acc = 0, prev = null, rows = 0;
  for (let i = 0; i < lanePts.length; i++){
    const p = lanePts[i];
    if (p.u < FELT_U - 0.004) continue;          // small overlap with the water tiles
    if (prev) acc += Math.hypot(p.x - prev.x, p.z - prev.z);
    prev = p;
    const nx = -p.tz, nz = p.tx;
    pos.push(p.x + nx*LANE_HW, -1, p.z + nz*LANE_HW,
             p.x - nx*LANE_HW, -1, p.z - nz*LANE_HW);
    const v = acc * 0.045;
    uv.push(0, v, 2.2, v);
    rows++;
  }
  for (let k = 0; k < rows - 1; k++){
    const a = k*2, b = k*2+1, c = (k+1)*2, d = (k+1)*2+1;
    idx.push(a, c, b,  b, c, d);
  }
  const rgeo = new T.BufferGeometry();
  rgeo.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
  rgeo.setAttribute('uv', new T.Float32BufferAttribute(uv, 2));
  rgeo.setIndex(idx); rgeo.computeVertexNormals();
  const roadMat = feltMat(0x8f7f96, feltTex); roadMat.side = T.DoubleSide;
  feltGroup.add(new T.Mesh(rgeo, roadMat));

  // wool-tuft walls + berms: rows of lumpy bobbles lining both felt edges (one instanced draw)
  const stitchDash = [];
  for (let i = 0; i < lanePts.length; i++){
    const p = lanePts[i];
    if (p.u < FELT_U) continue;
    const nx = -p.tz, nz = p.tx;
    if (i % 3 === 0){                              // berm of tufts on each side
      for (const side of [-1, 1]){
        const clump = 2 + ((i>>2) % 2);
        for (let j = 0; j < clump; j++){
          const off = LANE_HW + 1.5 + j*2.6 + Math.random()*1.4;
          const s = 2.0 + Math.random()*2.4;
          tuftList.push({
            x: p.x + nx*off*side + (Math.random()-0.5)*1.5,
            y: -0.4 + j*1.2 + Math.random()*1.4,
            z: p.z + nz*off*side + (Math.random()-0.5)*1.5,
            s, sy: s*(0.8+Math.random()*0.5), sz: s*(0.85+Math.random()*0.4),
            rx: Math.random()*6.28, ry: Math.random()*6.28, rz: Math.random()*6.28,
            c: FELT_WOOL[(i + j + (side>0?3:0)) % FELT_WOOL.length]
          });
        }
      }
    }
    // running-stitch dashes down the felt lane center (instead of neon dashes)
    if (i % 6 === 0){
      stitchDash.push({ x:p.x, y:-0.55, z:p.z, s:0.6, sy:0.35, sz:1.9,
        rx:0, ry:-Math.atan2(nx,nz), rz:0, c: FELT_YARN[(i/6|0) % FELT_YARN.length] });
    }
  }
  // running-stitch as tiny felt box "threads" (own small instanced draw of unit boxes)
  const stitchGeo = new T.BoxGeometry(1,1,1);
  const stitchMesh = new T.InstancedMesh(stitchGeo, feltMat(0xe8e4d9), stitchDash.length);
  const sd = new T.Object3D(), sc = new T.Color();
  stitchDash.forEach((v,i) => {
    sd.position.set(v.x, v.y, v.z); sd.rotation.set(v.rx, v.ry, v.rz);
    sd.scale.set(v.s, v.sy, v.sz); sd.updateMatrix(); stitchMesh.setMatrixAt(i, sd.matrix);
    sc.setHex(v.c); stitchMesh.setColorAt(i, sc);
  });
  stitchMesh.instanceMatrix.needsUpdate = true;
  if (stitchMesh.instanceColor) stitchMesh.instanceColor.needsUpdate = true;
  feltGroup.add(stitchMesh);

  // a couple of yarn/thread strands (thin tubes) stitched along a seam beside the lane
  for (let s = 0; s < 2; s++){
    const seamPts = [];
    for (let i = 0; i < lanePts.length; i += 8){
      const p = lanePts[i];
      if (p.u < FELT_U) continue;
      const nx = -p.tz, nz = p.tx, side = s === 0 ? 1 : -1;
      seamPts.push(new T.Vector3(p.x + nx*(LANE_HW-1)*side, 0.4 + Math.sin(i*0.5)*0.6, p.z + nz*(LANE_HW-1)*side));
    }
    if (seamPts.length > 1){
      const yc = new T.CatmullRomCurve3(seamPts);
      feltGroup.add(new T.Mesh(new T.TubeGeometry(yc, 120, 0.28, 5, false),
        feltMat(FELT_YARN[s % FELT_YARN.length])));
    }
  }
})();

function chevronGeo(){

function starShape(spikes, outer, inner){
  const s = new T.Shape();
  for (let i = 0; i < spikes*2; i++){

    const a = (i/(spikes*2))*Math.PI*2 - Math.PI/2;
    const x = Math.cos(a)*r, y = Math.sin(a)*r;
    if (i === 0) s.moveTo(x, y); else s.lineTo(x, y);
  }
  s.closePath(); return s;
}

wakeGeo.setAttribute('position', new T.BufferAttribute(wakePos, 3));
wakeGeo.setAttribute('color', new T.BufferAttribute(wakeCol, 3));
const wakeMat = new T.PointsMaterial({ size:1.7, vertexColors:true, transparent:true, opacity:0.85, depthWrite:false });
const wakePoints = new T.Points(wakeGeo, wakeMat); scene.add(wakePoints);
const wakeParticles = []; let wakeHead = 0;
function spawnWake(x, y, z, boosted){
  const p = wakeParticles[wakeHead] || (wakeParticles[wakeHead] = {});
  p.x = x + (Math.random()-0.5)*1.4;
  p.y = y + (Math.random()-0.5)*0.9;
  p.z = z + (Math.random()-0.5)*1.4;
  p.maxLife = boosted ? 0.95 : 0.6; p.life = p.maxLife;
  if (boosted){ p.r=1.0; p.g=0.75; p.b=0.35; } else { p.r=0.43; p.g=0.95; p.b=0.82; }
  wakeHead = (wakeHead + 1) % WAKE_MAX;
}
function updateWake(dt){
  for (let i = 0; i < WAKE_MAX; i++){
    const p = wakeParticles[i];
    if (!p || p.life <= 0){ wakePos[i*3+1] = -9999; continue; }
    p.life -= dt;
    const tt = Math.max(0, p.life / p.maxLife);
    wakePos[i*3]=p.x; wakePos[i*3+1]=p.y + (1-tt)*1.6; wakePos[i*3+2]=p.z;
    wakeCol[i*3]=p.r*tt+0.02; wakeCol[i*3+1]=p.g*tt+0.05; wakeCol[i*3+2]=p.b*tt+0.06;
  }
  wakeGeo.attributes.position.needsUpdate = true;
  wakeGeo.attributes.color.needsUpdate = true;
}

// ================= drive physics =================
const state = {
  x: lanePts[0].x, z: lanePts[0].z,
  heading: Math.atan2(lanePts[0].tx, lanePts[0].tz),
  speed: 0, lean: 0, boostFuel: 1, boosting: false, boostFlashT: 0,
  started: false, finished: false, elapsed: 0, lastU: 0, inFelt: false, inspect: false
};
const MAX_SPEED = 46, BOOST_SPEED = 78, ACCEL = 38, DRAG = 0.9, BRAKE_DRAG = 2.4;
const TURN_RATE = 1.9, LEAN_MAX = 0.55, BOOST_DRAIN = 0.55, BOOST_REGEN = 0.18;

// animation driver state
const anim = {
  tailPhase: 0, sway: 0, swayVel: 0, prevHeading: state.heading, prevSpeed: 0,
  boostBlow: 0, boostKick: 0, pitch: 0, blinkT: 0, blinkCd: 2.5, twinkle: 0
};

const keys = {};
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if (e.key===' ') e.preventDefault(); });
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

let isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
if (isTouch) document.body.classList.add('touch');
const joyZone = document.getElementById('joyZone');
const joyKnob = document.getElementById('joyKnob');
let joy = { active:false, id:null, dx:0, dy:0, cx:0, cy:0 };
function joyReset(){ joy.active=false; joy.id=null; joy.dx=0; joy.dy=0; joyKnob.style.transform='translate(-50%,-50%)'; }
joyZone.addEventListener('pointerdown', e => {
  if (state.inspect) return;                       // orbit owns the drag while inspecting
  joyZone.setPointerCapture(e.pointerId);
  joy.active = true; joy.id = e.pointerId;
  const r = joyZone.getBoundingClientRect(); joy.cx = r.left + r.width/2; joy.cy = r.top + r.height/2;
});
joyZone.addEventListener('pointermove', e => {
  if (state.inspect || !joy.active || e.pointerId !== joy.id) return;
  const max = 40;
  let dx = e.clientX - joy.cx, dy = e.clientY - joy.cy;
  const d = Math.hypot(dx, dy); if (d > max){ dx = dx/d*max; dy = dy/d*max; }
  joy.dx = dx/max; joy.dy = dy/max;
  joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
});
addEventListener('pointerup', e => { if (joy.id === e.pointerId) joyReset(); });
addEventListener('pointercancel', e => { if (joy.id === e.pointerId) joyReset(); });

const boostBtn = document.getElementById('boostbtn');
let touchBoost = false;
boostBtn.addEventListener('pointerdown', e => { if (state.inspect) return; touchBoost = true; boostBtn.classList.add('active'); e.preventDefault(); });
addEventListener('pointerup', () => { touchBoost = false; boostBtn.classList.remove('active'); });
addEventListener('pointercancel', () => { touchBoost = false; boostBtn.classList.remove('active'); });

// ================= INSPECT: free-orbit camera around Juan =================
// While inspecting, physics is frozen (Juan can't drive off) and the camera orbits him:
// drag = yaw/pitch, wheel/pinch = zoom. Handlers are gated on state.inspect so they never
// fight the joystick when inspect is OFF.
const orbit = { yaw: 0, pitch: 0.32, dist: 26, pinchPrev: null };
const ORBIT_MIN = 14, ORBIT_MAX = 92, PITCH_LIM = 1.4;
const orbitPtrs = new Map();
const inspectBtn = document.getElementById('inspectBtn');

function toggleInspect(){
  state.inspect = !state.inspect;
  document.body.classList.toggle('inspect', state.inspect);
  inspectBtn.classList.toggle('on', state.inspect);
  inspectBtn.textContent = state.inspect ? '▶ Resume' : '🔍 Inspect';
  if (state.inspect){
    // start the orbit from roughly the current behind-view, then let drag take over
    orbit.yaw = state.heading + Math.PI;
    orbit.pitch = 0.32; orbit.dist = 28;
    joyReset(); touchBoost = false; boostBtn.classList.remove('active');
    statusEl.textContent = 'INSPECT — drag to orbit · scroll / pinch to zoom';
  } else {
    orbitPtrs.clear(); orbit.pinchPrev = null;
    statusEl.textContent = state.started ? '¡Vamos! Chase the boost rings' : 'Swim to the start line';
  }
}
inspectBtn.addEventListener('click', toggleInspect);

canvas.addEventListener('pointerdown', e => {
  if (!state.inspect) return;
  canvas.setPointerCapture(e.pointerId);
  orbitPtrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  orbit.pinchPrev = null;
  e.preventDefault();
});
canvas.addEventListener('pointermove', e => {
  if (!state.inspect || !orbitPtrs.has(e.pointerId)) return;
  const prev = orbitPtrs.get(e.pointerId);
  orbitPtrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (orbitPtrs.size >= 2){
    // pinch-zoom: distance between the two active pointers
    const pts = [...orbitPtrs.values()];
    const cur = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    if (orbit.pinchPrev != null && cur > 0){
      orbit.dist *= orbit.pinchPrev / cur;
      orbit.dist = Math.max(ORBIT_MIN, Math.min(ORBIT_MAX, orbit.dist));
    }
    orbit.pinchPrev = cur;
  } else {
    orbit.yaw   -= (e.clientX - prev.x) * 0.01;
    orbit.pitch += (e.clientY - prev.y) * 0.01;
    orbit.pitch = Math.max(-PITCH_LIM, Math.min(PITCH_LIM, orbit.pitch));
  }
});
function orbitPtrEnd(e){ if (orbitPtrs.delete(e.pointerId)) orbit.pinchPrev = null; }
canvas.addEventListener('pointerup', orbitPtrEnd);
canvas.addEventListener('pointercancel', orbitPtrEnd);
canvas.addEventListener('wheel', e => {
  if (!state.inspect) return;
  e.preventDefault();
  orbit.dist *= (1 + e.deltaY * 0.001);
  orbit.dist = Math.max(ORBIT_MIN, Math.min(ORBIT_MAX, orbit.dist));
}, { passive: false });

function readInput(){
  let steer = 0, throttle = 0, boost = false;
  if (keys['arrowleft'] || keys['a']) steer -= 1;
  if (keys['arrowright'] || keys['d']) steer += 1;
  if (keys['arrowup'] || keys['w']) throttle += 1;
  if (keys['arrowdown'] || keys['s']) throttle -= 1;
  if (keys[' '] || keys['shift']) boost = true;
  if (joy.active){ steer += joy.dx; throttle += -joy.dy; }
  if (touchBoost) boost = true;
  // BUGFIX: L/R were inverted vs. the chase cam (the +heading integration turns toward
  // world +x, which is screen-LEFT from behind). Flip the assembled steer once here so
  // BOTH keyboard and joystick come out correct; lean = -steer keeps him banking INTO turns.
  steer = -steer;
  steer = Math.max(-1, Math.min(1, steer));
  throttle = Math.max(-1, Math.min(1, throttle || (isTouch ? 0.6 : 0)));
  return { steer, throttle, boost };
}

// HUD
const speedVal = document.getElementById('speedVal');
const speedoBox = document.getElementById('speedo');
const bmFill = document.getElementById('bmFill');
const statusEl = document.getElementById('status');
const splitEl = document.getElementById('split');
const speedlinesEl = document.getElementById('speedlines');
const boostflashEl = document.getElementById('boostflash');
const finishEl = document.getElementById('finish');
const finishTime = document.getElementById('finishTime');
document.getElementById('againBtn').addEventListener('click', resetRun);

function resetRun(){
  state.x = lanePts[0].x; state.z = lanePts[0].z;
  state.heading = Math.atan2(lanePts[0].tx, lanePts[0].tz);
  state.speed = 0; state.lean = 0; state.boostFuel = 1;
  state.boosting = false; state.started = false; state.finished = false; state.elapsed = 0;
  state.lastU = 0; state.inFelt = false;
  anim.prevHeading = state.heading; anim.prevSpeed = 0;
  for (const r of rings){ r.hit = false; r.core.visible = true; r.halo.visible = true; }
  finishEl.classList.remove('show');
  statusEl.textContent = 'Swim to the start line';
}

let splitTimer = null;
function showSplit(text){
  splitEl.textContent = text; splitEl.classList.add('show');
  clearTimeout(splitTimer);
  splitTimer = setTimeout(() => splitEl.classList.remove('show'), 1200);
}

// ================= main loop =================
resize();
let last = performance.now();
const _desired = new T.Vector3(), _look = new T.Vector3();
(function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  requestAnimationFrame(loop);
  const time = now * 0.001;
  const inspecting = state.inspect;
  const input = inspecting ? { steer:0, throttle:0, boost:false } : readInput();
  if (inspecting){ state.boosting = false; state.speed *= Math.max(0, 1 - 2.5*dt); } // freeze drive, settle to idle

  if (!state.finished && !inspecting){
    const wantBoost = input.boost && state.boostFuel > 0.02;
    if (wantBoost && anim.boostBlow < 0.1) anim.boostKick = 1;  // stretch pop on boost start
    state.boosting = wantBoost;
    const targetTop = wantBoost ? BOOST_SPEED : MAX_SPEED;
    if (input.throttle > 0.01){
      state.speed += ACCEL * input.throttle * (wantBoost ? 1.6 : 1) * dt;
    } else if (input.throttle < -0.01){
      state.speed -= BRAKE_DRAG * 10 * (-input.throttle) * dt;
    } else {
      state.speed -= DRAG * dt * 6;
    }
    state.speed = Math.max(0, Math.min(targetTop, state.speed));
    if (!wantBoost && state.speed > MAX_SPEED) state.speed = Math.max(MAX_SPEED, state.speed - 60*dt);

    if (wantBoost) state.boostFuel = Math.max(0, state.boostFuel - BOOST_DRAIN*dt);
    else state.boostFuel = Math.min(1, state.boostFuel + BOOST_REGEN*dt);

    const sf = state.speed / MAX_SPEED;
    state.heading += input.steer * TURN_RATE * (0.35 + 0.65*Math.min(1,sf)) * dt;
    const targetLean = -input.steer * LEAN_MAX * Math.min(1, 0.4 + sf);
    state.lean += (targetLean - state.lean) * Math.min(1, 6*dt);

    state.x += Math.sin(state.heading) * state.speed * dt;
    state.z += Math.cos(state.heading) * state.speed * dt;

    const near = nearestLane(state.x, state.z);
    if (near.dist > LANE_HW){
      const p = near.pt, nx = -p.tz, nz = p.tx;
      const side = (state.x-p.x)*nx + (state.z-p.z)*nz > 0 ? 1 : -1;
      state.x = p.x + nx*LANE_HW*side*0.98;
      state.z = p.z + nz*LANE_HW*side*0.98;
      state.speed *= 0.85;
    }

    state.lastU = near.u;
    if (!state.started && near.u > 0.015){ state.started = true; statusEl.textContent = '¡Vamos! Chase the boost rings'; }
    if (!state.inFelt && near.u >= FELT_U){ state.inFelt = true; statusEl.textContent = 'Welcome to FELICIA — the wool valley'; }
    if (state.started) state.elapsed += dt;

    for (const r of rings){
      if (r.hit) continue;
      const d = Math.hypot(state.x - r.pt.x, state.z - r.pt.z);
      if (d < 8){
        r.hit = true; state.boostFuel = 1;
        state.speed = Math.min(BOOST_SPEED, state.speed + 18);
        state.boostFlashT = 0.4; anim.boostKick = 1;
        showSplit('¡BOOST RING!'); r.glow.intensity = 2.6;
      }
    }

    if (state.started && !state.finished && near.u > finishGate.u){
      state.finished = true;
      finishTime.textContent = 'Time: ' + state.elapsed.toFixed(1) + 's';
      finishEl.classList.add('show');
    }

    if (state.speed > 4){
      const tailX = state.x - Math.sin(state.heading) * (charLen*charScale*0.5);
      const tailZ = state.z - Math.cos(state.heading) * (charLen*charScale*0.5);
      const rate = state.boosting ? 3 : 1;
      for (let k = 0; k < rate; k++) spawnWake(tailX, 1.4, tailZ, state.boosting);
    }
    if (state.boostFlashT > 0) state.boostFlashT = Math.max(0, state.boostFlashT - dt);
  }

  // ---- ease world mood teal -> felt magenta across the transition ----
  const feltProg = Math.max(0, Math.min(1, ((state.lastU||0) - (FELT_U - 0.03)) / 0.06));
  scene.background.lerpColors(WATER_BG, FELT_BG, feltProg);
  scene.fog.color.lerpColors(WATER_FOG, FELT_FOG, feltProg);

  // ---- ring visuals ----
  for (const r of rings){
    r.spin += dt; r.grp.rotation.z = r.spin*0.6;
    r.core.material.emissiveIntensity = r.hit ? 0.15 : (0.55 + Math.sin(r.spin*3)*0.2);
    r.halo.material.opacity = r.hit ? 0.05 : (0.12 + Math.sin(r.spin*3)*0.06);
    r.glow.intensity = Math.max(r.hit ? 0.1 : 0.9, r.glow.intensity - dt*2);
    if (r.hit){ r.core.visible = (r.spin % 0.6) < 0.3; r.halo.visible = false; }
  }
  // ---- chevron traveling glow ----
  for (const c of chevrons){
    const phase = (time*3 + c.order*0.7) % 3;
    const lit = phase < 1 ? (1 - phase) : 0;
    c.mesh.material.color.setRGB(0.35 + lit*0.65, 0.22 + lit*0.5, 0.05 + lit*0.1);
    c.mesh.material.opacity = 0.55 + lit*0.4;
  }
  // ---- lane edge neon pulse ----
  const edgePulse = 0.9 + Math.sin(time*2)*0.35;
  edgeMats[0].emissiveIntensity = edgePulse;
  edgeMats[1].emissiveIntensity = edgePulse;
  // ---- motes drift ----
  for (let i = 0; i < moteSeed.length; i++){
    const s = moteSeed[i];
    motePos[i*3]   = moteBase[i*3]   + Math.cos(time*0.25 + s)*1.6;
    motePos[i*3+1] = moteBase[i*3+1] + Math.sin(time*0.3 + s)*1.9;
    motePos[i*3+2] = moteBase[i*3+2] + Math.sin(time*0.2 + s*1.3)*1.6;
  }
  motePoints.geometry.attributes.position.needsUpdate = true;

  updateWake(dt);

  // ================= JUAN animation layer =================
  const speedFrac = Math.min(1, state.speed / MAX_SPEED);
  const accel = (state.speed - anim.prevSpeed) / Math.max(dt, 0.001);
  anim.prevSpeed = state.speed;
  const headingDelta = state.heading - anim.prevHeading;
  anim.prevHeading = state.heading;

  anim.boostBlow += ((state.boosting ? 1 : 0) - anim.boostBlow) * Math.min(1, 6*dt);
  anim.boostKick = Math.max(0, anim.boostKick - dt*3);
  anim.pitch += ((Math.max(-0.22, Math.min(0.22, accel*0.006))) - anim.pitch) * Math.min(1, 5*dt);

  // secondary-motion spring (lateral sway from turning) — damped + heading kick
  anim.swayVel += (-anim.sway*38 - anim.swayVel*9) * dt - headingDelta*6;
  anim.sway += anim.swayVel * dt;
  anim.sway = Math.max(-0.7, Math.min(0.7, anim.sway));

  // 1) flagellum undulation — freq & amplitude scale with speed; boost whips
  anim.tailPhase += dt * (3 + speedFrac*11 + (state.boosting?6:0));
  const amp = 0.35 + speedFrac*1.5 + anim.boostBlow*0.9;
  for (const s of tailSegs){
    const ph = anim.tailPhase - s.t*6.2;
    s.mesh.position.x = Math.sin(ph) * amp * (0.12 + s.t);
    s.mesh.position.y = Math.cos(ph*0.9) * amp * 0.35 * s.t;
    s.mesh.position.z = s.z0;
  }

  // 2) body: lean (roll), pitch, boost squash/stretch
  const stretch = anim.boostKick*0.28 + (state.boosting?0.12:0);
  juanBody.rotation.z = state.lean;
  juanBody.rotation.x = anim.pitch;
  juanBody.scale.set(charScale*(1 - stretch*0.4), charScale*(1 - stretch*0.4), charScale*(1 + stretch));

  // 3) head bob (stronger when slow) + idle
  headGroup.position.y = Math.sin(time*2.2) * (0.18 * (1 - speedFrac*0.7)) + Math.sin(time*5)*0.03;

  // 4) mustache tips: sway lag + blow-back on boost + accel jiggle
  for (let i = 0; i < stacheTips.length; i++){
    const sx = i === 0 ? -1 : 1, tg = stacheTips[i];
    tg.rotation.z = anim.sway*0.6*sx + Math.sin(time*7 + i)*0.04;
    tg.rotation.x = -anim.boostBlow*0.9 - Math.max(0, accel)*0.004;
  }

  // 5) sombrero tassel: lag swing + blow back; hat lags a touch on turns
  tasselGroup.rotation.z = -anim.sway*1.4 + Math.sin(time*3.3)*0.06;
  tasselGroup.rotation.x =  0.2 + anim.boostBlow*0.7 + Math.max(0,accel)*0.003;
  hatGroup.rotation.z = anim.sway*0.25;

  // 6) earrings: pendulum swing from sway + boost
  for (let i = 0; i < earrings.length; i++){
    earrings[i].rotation.z = anim.sway*0.9 + Math.sin(time*4 + i)*0.05;
    earrings[i].rotation.x = anim.boostBlow*0.4;
  }

  // 7) face life: blink + star-eye twinkle
  anim.blinkCd -= dt;
  if (anim.blinkCd <= 0 && anim.blinkT <= 0){ anim.blinkT = 0.16; anim.blinkCd = 2 + Math.random()*3.5; }
  if (anim.blinkT > 0) anim.blinkT -= dt;
  const blinkS = anim.blinkT > 0 ? Math.max(0.08, Math.abs(Math.sin(anim.blinkT/0.16*Math.PI))) : 1;
  anim.twinkle += dt;
  const spk = 1 + Math.max(0, Math.sin(anim.twinkle*2.5)) * 0.9;
  for (const e of eyeParts){ e.group.scale.y = blinkS; e.sparkle.scale.setScalar(spk); }

  // ---- place Juan in the world ----
  charGroup.position.set(state.x, 3.0, state.z);
  charGroup.rotation.y = state.heading;

  // ---- camera: free-orbit while inspecting, else chase (+ boost FOV kick) ----
  if (inspecting){
    const tx = state.x, ty = 3.4, tz = state.z;            // orbit target = Juan
    const cp = Math.cos(orbit.pitch), sp = Math.sin(orbit.pitch);
    _desired.set(
      tx + orbit.dist * cp * Math.sin(orbit.yaw),
      ty + orbit.dist * sp,
      tz + orbit.dist * cp * Math.cos(orbit.yaw)
    );
    cam.position.lerp(_desired, Math.min(1, 8*dt));
    _look.set(tx, ty, tz);
    cam._lookSmoothed = cam._lookSmoothed || _look.clone();
    cam._lookSmoothed.lerp(_look, Math.min(1, 8*dt));
    cam.lookAt(cam._lookSmoothed);
    cam.fov += (BASE_FOV - cam.fov) * Math.min(1, 4*dt);
    cam.updateProjectionMatrix();
  } else {
    const camBack = 24, camUp = 10;
    _desired.set(
      state.x - Math.sin(state.heading)*camBack,
      camUp,
      state.z - Math.cos(state.heading)*camBack
    );
    cam.position.lerp(_desired, Math.min(1, 5*dt));
    _look.set(
      state.x + Math.sin(state.heading)*8,
      2.4 + Math.sin(time*2)*0.15,
      state.z + Math.cos(state.heading)*8
    );
    cam._lookSmoothed = cam._lookSmoothed || _look.clone();
    cam._lookSmoothed.lerp(_look, Math.min(1, 6*dt));
    cam.lookAt(cam._lookSmoothed);
    const targetFov = state.boosting ? BOOST_FOV : BASE_FOV;
    cam.fov += (targetFov - cam.fov) * Math.min(1, 4*dt);
    cam.updateProjectionMatrix();
  }

  // ---- HUD + overlays ----
  speedVal.textContent = Math.round(state.speed);
  speedoBox.classList.toggle('boost', state.boosting);
  bmFill.style.width = Math.round(state.boostFuel*100) + '%';
  bmFill.classList.toggle('full', state.boostFuel > 0.97);
  const speedT = Math.min(1, state.speed / MAX_SPEED);
  speedlinesEl.style.opacity = (state.boosting ? 0.85 : speedT*0.4).toFixed(2);
  boostflashEl.classList.toggle('on', state.boostFlashT > 0);

  renderer.render(scene, cam);
})(last);

})();
</script>
</body>
</html>
