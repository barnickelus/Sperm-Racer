name: Deploy Sperm Racer to GitHub Pages

# Publishes index.html (the "Pick Your Sperm" character select) as a live page.
# `configure-pages` with enablement:true turns Pages on automatically,
# so no manual toggle in repo Settings is required.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes supersede in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url || steps.deployment3.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # The published copy only: the comments and spacing come out of the page's script (tools/slim-page.mjs),
      # about a third less for a browser to download and read, and the script is set beside the page as
      # game.js, so a browser can keep its compiled form between visits and read it while it arrives.
      # The repository's index.html is never changed. If the step cannot do its work it says so, and the
      # page is published as written.
      - name: Slim the published page
        continue-on-error: true
        run: node tools/slim-page.mjs index.html

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Repo root: index.html is the entry point.
          path: "."

      # GitHub can take a moment to list a freshly uploaded artifact, and deploy-pages gives up at once when it is
      # not listed yet ("No artifacts named github-pages"). Wait until the run's artifact list shows it (up to 2 min).
      - name: Wait for the artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 24); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '[.artifacts[] | select(.name=="github-pages")] | length' || echo 0)
            if [ "$n" -gt 0 ]; then echo "listed after $((i*5-5))s"; exit 0; fi
            sleep 5
          done
          echo "not listed after 2 min; deploying anyway"

      # The list above and deploy-pages do not ask the same service: the run's artifact list has shown the artifact at
      # once while deploy-pages still found none a second later ("Found 0 artifact(s)"), three pushes running. So the
      # deploy itself is tried up to three times, with a pause before each retry; a try that fails only fails the run
      # if the last one does.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Pause before a second try
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (second try)
        id: deployment2
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Pause before a third try
        if: steps.deployment2.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (third try)
        id: deployment3
        if: steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v4
